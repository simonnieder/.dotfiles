general {
    lock_cmd = pidof hyprlock || $HOME/.config/scripts/session-power.sh lock  # pause tracker while locked.
    before_sleep_cmd = pidof hyprlock || loginctl lock-session  # lock sleeps not started by the power script.
}

listener {
    timeout = 300                                   # 5min.
    on-timeout = brightnessctl -s set 10            # dim backlight, avoid 0 on OLED.
    on-resume = brightnessctl -r                    # restore backlight.
}

listener {
    timeout = 305                                   # 5min.
    on-timeout = loginctl lock-session              # lock screen.
}

listener {
    timeout = 10                                    # re-arm after every wake while locked.
    condition_cmd = pgrep -x hyprlock               # do nothing while the session is unlocked.
    on-timeout = $HOME/.config/scripts/display-power.sh off
    on-resume = $HOME/.config/scripts/display-power.sh on
    ignore_inhibit = true                           # videos and apps cannot keep a locked screen on.
}

listener {
    timeout = 1800                                  # 30min.
    on-timeout = $HOME/.config/scripts/session-power.sh suspend-then-hibernate  # pause tracker around suspend.
}
