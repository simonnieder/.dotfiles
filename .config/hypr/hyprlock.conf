source = colors.conf

$text = $on_surface
$text_muted = $on_surface_variant
$accent = $primary
$danger = $error
$warn = $tertiary
$font = FiraCode Nerd Font Mono

general {
  disable_loading_bar = true
  hide_cursor = true
  no_fade_out = true
}

background {
  monitor =
  path = screenshot
  color = $background
  blur_passes = 3
  blur_size = 8
  noise = 0.0117
  contrast = 0.95
  brightness = 0.80
  vibrancy = 0.18
  vibrancy_darkness = 0.2
}

label {
  monitor =
  text = cmd[update:60000] date +"%A, %B %-d"
  color = $text_muted
  font_size = 26
  font_family = $font
  position = 0, 150
  halign = center
  valign = center
}

label {
  monitor =
  text = $TIME
  color = $text
  font_size = 96
  font_family = $font
  position = 0, 40
  halign = center
  valign = center
}

input-field {
  monitor =
  size = 320, 58
  outline_thickness = 2
  dots_size = 0.22
  dots_spacing = 0.18
  dots_center = true
  dots_rounding = -1
  outer_color = rgba(8d9199ff)
  inner_color = rgba(111318cc)
  font_color = $text
  font_family = $font
  fade_on_empty = true
  placeholder_text =
  hide_input = false
  rounding = -1
  check_color = $accent
  fail_color = $danger
  fail_text = $FAIL ($ATTEMPTS)
  capslock_color = $warn
  position = 0, -95
  halign = center
  valign = center
}
